<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 8px 0 12px; color: #193c32;
            font: 14px/1.4 'DM Sans', sans-serif;
        }
        #app { width: 100%; }
        .pin-hint { margin: 0 0 10px; color: #68766f; font-size: 13px; }
        .board-shell {
            display: flex; width: 100%; justify-content: center;
            overflow: visible;
        }
        .image-wrap {
            position: relative; display: block; width: 100%; max-width: 100%;
            line-height: 0; cursor: crosshair;
        }
        .image-wrap img {
            display: block; width: 100%; max-width: 100%; height: auto;
        }
        .terrain-layer {
            position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%;
            overflow: visible; pointer-events: none;
        }
        .pin-layer {
            position: absolute; z-index: 3; inset: 0; pointer-events: none;
        }
        .image-wrap.terrain-active .pin { pointer-events: none; }
        .fog-canvas {
            position: absolute; z-index: 2; inset: 0; display: block;
            width: 100%; height: 100%; touch-action: none;
        }
        .pin {
            position: absolute; z-index: 1; width: 0; height: 0;
            pointer-events: auto;
        }
        .pin-marker {
            position: absolute; left: 0; top: 0; display: inline-flex;
            width: 23px; height: 23px; align-items: center; justify-content: center;
            border: 2px solid #fff; border-radius: 50%; background: #bd573d;
            color: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            font-size: 12px; font-weight: 700; line-height: 1;
            transform: translate(-50%, -50%); cursor: grab; touch-action: none;
        }
        .pin-marker:active { cursor: grabbing; }
        .pin-caption {
            position: absolute; left: 15px; top: 0; display: flex;
            align-items: center; gap: 5px; transform: translateY(-50%);
        }
        .pin-label {
            display: block; max-width: 150px; overflow: hidden; padding: 4px 7px;
            border: 2px solid #ffffff; border-radius: 6px;
            background: #ffffff !important; color: #0b1116 !important; opacity: 1;
            font-size: 12px; font-weight: 800; line-height: 1.2;
            font-family: inherit; text-align: left; text-overflow: ellipsis;
            white-space: nowrap; cursor: text;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.96), 0 2px 10px rgba(0, 0, 0, 0.28);
        }
        .pin-label:hover { border-color: #dfeaf2; background: #ffffff !important; }
        .pin-label-editor {
            width: min(180px, 48vw); min-width: 100px; padding: 6px 9px;
            border: 2px solid #ffffff; border-radius: 6px; outline: none;
            background: #ffffff !important; color: #0b1116 !important; opacity: 1;
            font: inherit;
            font-size: 13px; font-weight: 700; line-height: 1.2;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.96), 0 2px 10px rgba(0, 0, 0, 0.25);
        }
        .pin-remove {
            display: inline-flex; width: 20px; height: 20px; align-items: center;
            justify-content: center; padding: 0; border: 1px solid #fff;
            border-radius: 50%; background: #193c32; color: #fff;
            font: inherit; font-size: 14px; line-height: 1; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }
        .pin-remove:hover { background: #bd573d; }
        @media (max-width: 600px) {
            .pin-label { max-width: 100px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <main id="app"></main>
    <script>
        const app = document.getElementById('app');
        const FOG_COLOR = '#19211f';
        const MAX_FOG_STROKES = 500;
        let currentPins = [];
        let currentRevision = 0;
        let currentFogRevision = 0;
        let currentFogStrokes = [];
        let fogBaseRevealed = false;
        let activeFogStroke = null;
        let fogResizeObserver = null;
        let currentTerrain = [];
        let currentTerrainDraft = [];
        let currentTerrainRevision = 0;
        let terrainEnabled = false;
        let selectedTerrainType = 'Wasser';
        let selectedLabel = 'Monster';

        function sendPins() {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: 'streamlit:setComponentValue',
                value: {
                    revision: ++currentRevision,
                    pins: currentPins,
                    fog_revision: ++currentFogRevision,
                    fog_strokes: currentFogStrokes,
                    fog_base_revealed: fogBaseRevealed,
                    terrain_revision: currentTerrainRevision,
                    terrain: currentTerrain,
                    terrain_draft: currentTerrainDraft
                },
                dataType: 'json'
            }, '*');
        }

        function normalizedPoint(event, image) {
            const bounds = image.getBoundingClientRect();
            if (!bounds.width || !bounds.height) return null;
            return {
                x: Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width)),
                y: Math.max(0, Math.min(1, (event.clientY - bounds.top) / bounds.height))
            };
        }

        function drawFogStroke(context, stroke, width, height) {
            if (!stroke.points.length) return;
            const radius = stroke.radius * Math.min(width, height);
            context.globalCompositeOperation = stroke.mode === 'reveal'
                ? 'destination-out'
                : 'source-over';
            context.strokeStyle = FOG_COLOR;
            context.fillStyle = FOG_COLOR;
            context.lineWidth = Math.max(1, radius * 2);
            context.lineCap = 'round';
            context.lineJoin = 'round';
            if (stroke.points.length === 1) {
                context.beginPath();
                context.arc(
                    stroke.points[0].x * width,
                    stroke.points[0].y * height,
                    radius,
                    0,
                    Math.PI * 2
                );
                context.fill();
                return;
            }
            context.beginPath();
            context.moveTo(stroke.points[0].x * width, stroke.points[0].y * height);
            stroke.points.slice(1).forEach(point => {
                context.lineTo(point.x * width, point.y * height);
            });
            context.stroke();
        }

        function renderFog(canvas, image, includeActiveStroke = false) {
            const bounds = image.getBoundingClientRect();
            if (!bounds.width || !bounds.height || !image.naturalWidth) return;
            const scale = window.devicePixelRatio || 1;
            canvas.width = Math.round(bounds.width * scale);
            canvas.height = Math.round(bounds.height * scale);
            const context = canvas.getContext('2d');
            context.setTransform(scale, 0, 0, scale, 0, 0);
            if (!fogBaseRevealed) {
                context.fillStyle = FOG_COLOR;
                context.fillRect(0, 0, bounds.width, bounds.height);
            }
            const strokes = includeActiveStroke && activeFogStroke
                ? [...currentFogStrokes, activeFogStroke]
                : currentFogStrokes;
            strokes.forEach(stroke => {
                drawFogStroke(context, stroke, bounds.width, bounds.height);
            });
            context.globalCompositeOperation = 'source-over';
        }

        function renderTerrain(layer) {
            const namespace = 'http://www.w3.org/2000/svg';
            const settings = {
                Wasser: { background: '#287ca8', stroke: '#b5e7ec' },
                Lava: { background: '#c74420', stroke: '#ffd166' },
                Grube: { background: '#282630', stroke: '#8b8791' },
                Treibsand: { background: '#a98b4d', stroke: '#ead69b' }
            };
            layer.replaceChildren();
            const definitions = document.createElementNS(namespace, 'defs');
            Object.entries(settings).forEach(([type, colors]) => {
                const pattern = document.createElementNS(namespace, 'pattern');
                pattern.setAttribute('id', `image-terrain-${type}`);
                pattern.setAttribute('width', '48');
                pattern.setAttribute('height', '48');
                pattern.setAttribute('patternUnits', 'userSpaceOnUse');
                const background = document.createElementNS(namespace, 'rect');
                background.setAttribute('width', '48');
                background.setAttribute('height', '48');
                background.setAttribute('fill', colors.background);
                pattern.append(background);
                const marks = document.createElementNS(namespace, 'path');
                marks.setAttribute('d', type === 'Wasser' || type === 'Treibsand'
                    ? 'M -8 12 Q 2 4 12 12 T 32 12 T 52 12 M -8 36 Q 2 28 12 36 T 32 36 T 52 36'
                    : type === 'Lava'
                        ? 'M 5 5 L 20 12 L 15 22 L 30 30 L 25 43 M 40 0 L 35 12 L 45 18'
                        : 'M 4 6 L 16 16 L 10 26 L 22 38 M 40 8 L 30 18 L 38 25 L 28 42');
                marks.setAttribute('fill', 'none');
                marks.setAttribute('stroke', colors.stroke);
                marks.setAttribute('stroke-width', type === 'Lava' ? '3' : '2');
                marks.setAttribute('stroke-linecap', 'round');
                marks.setAttribute('stroke-linejoin', 'round');
                pattern.append(marks);
                definitions.append(pattern);
            });
            layer.append(definitions);

            currentTerrain.forEach(area => {
                const colors = settings[area.type] || settings.Wasser;
                const polygon = document.createElementNS(namespace, 'polygon');
                polygon.setAttribute('points', area.points
                    .map(point => `${point.x * 1000},${point.y * 1000}`)
                    .join(' '));
                polygon.setAttribute('fill', `url(#image-terrain-${area.type})`);
                polygon.setAttribute('stroke', colors.stroke);
                polygon.setAttribute('stroke-width', '4');
                polygon.setAttribute('stroke-linejoin', 'round');
                layer.append(polygon);
            });

            if (currentTerrainDraft.length >= 2) {
                const colors = settings[selectedTerrainType] || settings.Wasser;
                const draft = document.createElementNS(namespace,
                    currentTerrainDraft.length >= 3 ? 'polygon' : 'polyline');
                draft.setAttribute('points', currentTerrainDraft
                    .map(point => `${point.x * 1000},${point.y * 1000}`)
                    .join(' '));
                draft.setAttribute('fill', currentTerrainDraft.length >= 3
                    ? colors.background
                    : 'none');
                draft.setAttribute('stroke', '#fff');
                draft.setAttribute('stroke-width', '4');
                draft.setAttribute('stroke-dasharray', '9 6');
                draft.setAttribute('stroke-linejoin', 'round');
                layer.append(draft);
            }
            currentTerrainDraft.forEach(point => {
                const marker = document.createElementNS(namespace, 'circle');
                marker.setAttribute('cx', point.x * 1000);
                marker.setAttribute('cy', point.y * 1000);
                marker.setAttribute('r', '7');
                marker.setAttribute('fill', '#bd573d');
                marker.setAttribute('stroke', '#fff');
                marker.setAttribute('stroke-width', '2');
                layer.append(marker);
            });
        }

        function updateHeight() {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: 'streamlit:setFrameHeight',
                height: document.documentElement.scrollHeight
            }, '*');
        }

        function renderPins(layer, image, showPinDetails) {
            layer.replaceChildren();
            currentPins.forEach((pin, index) => {
                const marker = document.createElement('div');
                marker.className = 'pin';
                marker.style.left = `${pin.x * 100}%`;
                marker.style.top = `${pin.y * 100}%`;

                const icon = document.createElement('span');
                icon.className = 'pin-marker';
                icon.setAttribute('aria-hidden', 'true');
                const iconText = document.createElement('span');
                iconText.textContent = String(index + 1);
                icon.append(iconText);

                let dragStart = null;
                icon.addEventListener('pointerdown', event => {
                    if (event.button !== 0) return;
                    event.preventDefault();
                    event.stopPropagation();
                    dragStart = { x: event.clientX, y: event.clientY, moved: false };
                    icon.setPointerCapture(event.pointerId);
                });
                icon.addEventListener('pointermove', event => {
                    if (!dragStart || !icon.hasPointerCapture(event.pointerId)) return;
                    if (!dragStart.moved) {
                        dragStart.moved = Math.hypot(
                            event.clientX - dragStart.x,
                            event.clientY - dragStart.y
                        ) > 3;
                    }
                    if (!dragStart.moved) return;
                    const bounds = image.getBoundingClientRect();
                    if (!bounds.width || !bounds.height) return;
                    pin.x = Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width));
                    pin.y = Math.max(0, Math.min(1, (event.clientY - bounds.top) / bounds.height));
                    marker.style.left = `${pin.x * 100}%`;
                    marker.style.top = `${pin.y * 100}%`;
                });
                const finishDrag = event => {
                    if (!dragStart || !icon.hasPointerCapture(event.pointerId)) return;
                    const moved = dragStart.moved;
                    dragStart = null;
                    icon.releasePointerCapture(event.pointerId);
                    if (moved) {
                        renderPins(layer, image, showPinDetails);
                        sendPins();
                    }
                };
                icon.addEventListener('pointerup', finishDrag);
                icon.addEventListener('pointercancel', finishDrag);

                marker.append(icon);
                if (showPinDetails) {
                    const label = document.createElement('button');
                    label.className = 'pin-label';
                    label.type = 'button';
                    label.title = 'Zum Umbenennen anklicken';
                    label.textContent = pin.label;
                    label.addEventListener('click', event => {
                        event.stopPropagation();
                        const editor = document.createElement('input');
                        editor.className = 'pin-label-editor';
                        editor.type = 'text';
                        editor.maxLength = 64;
                        editor.value = pin.label;
                        editor.setAttribute('aria-label', 'Pin umbenennen');
                        let saveChanges = true;
                        editor.addEventListener('keydown', keyEvent => {
                            if (keyEvent.key === 'Enter') {
                                keyEvent.preventDefault();
                                editor.blur();
                            } else if (keyEvent.key === 'Escape') {
                                saveChanges = false;
                                editor.blur();
                            }
                        });
                        editor.addEventListener('blur', () => {
                            const nextLabel = editor.value.trim();
                            if (saveChanges && nextLabel) pin.label = nextLabel;
                            renderPins(layer, image, showPinDetails);
                            if (saveChanges && nextLabel) sendPins();
                        }, { once: true });
                        label.replaceWith(editor);
                        editor.focus();
                        editor.select();
                    });

                    const caption = document.createElement('span');
                    caption.className = 'pin-caption';
                    caption.append(label);

                    const remove = document.createElement('button');
                    remove.className = 'pin-remove';
                    remove.type = 'button';
                    remove.title = 'Pin entfernen';
                    remove.setAttribute('aria-label', `${pin.label} entfernen`);
                    remove.textContent = '\u00d7';
                    caption.append(remove);
                    remove.addEventListener('click', event => {
                        event.stopPropagation();
                        currentPins = currentPins.filter(item => item.id !== pin.id);
                        renderPins(layer, image, showPinDetails);
                        sendPins();
                        updateHeight();
                    });
                    marker.append(caption);
                }
                layer.append(marker);
            });
            updateHeight();
        }

        function render(args) {
            if (fogResizeObserver) fogResizeObserver.disconnect();
            const incomingRevision = Number.isInteger(args.pins_revision)
                ? args.pins_revision
                : 0;
            if (incomingRevision >= currentRevision) {
                currentPins = Array.isArray(args.pins) ? args.pins : [];
                currentRevision = incomingRevision;
            }
            const incomingFogRevision = Number.isInteger(args.fog_revision)
                ? args.fog_revision
                : 0;
            if (incomingFogRevision >= currentFogRevision) {
                currentFogStrokes = Array.isArray(args.fog_strokes)
                    ? args.fog_strokes
                    : [];
                fogBaseRevealed = args.fog_base_revealed === true;
                currentFogRevision = incomingFogRevision;
            }
            const incomingTerrainRevision = Number.isInteger(args.terrain_revision)
                ? args.terrain_revision
                : 0;
            if (incomingTerrainRevision >= currentTerrainRevision) {
                currentTerrain = Array.isArray(args.terrain) ? args.terrain : [];
                currentTerrainDraft = Array.isArray(args.terrain_draft)
                    ? args.terrain_draft
                    : [];
                currentTerrainRevision = incomingTerrainRevision;
            }
            terrainEnabled = args.terrain_enabled === true && args.fog_enabled !== true;
            selectedTerrainType = args.selected_terrain_type || 'Wasser';
            selectedLabel = args.selected_label || 'Monster';
            const showPinDetails = args.show_pin_details !== false;
            const fogEnabled = args.fog_enabled === true;
            const fogMode = args.fog_mode === 'Verdecken' ? 'cover' : 'reveal';
            const brushRadius = Math.max(
                0.01,
                Math.min(0.3, (Number(args.fog_brush_size) || 10) / 100)
            );
            app.replaceChildren();

            const hint = document.createElement('p');
            hint.className = 'pin-hint';
            hint.textContent = terrainEnabled
                ? `Gelände zeichnen: Punkte für ${selectedTerrainType} setzen und die Fläche abschließen.`
                : fogEnabled
                ? `Nebel-Werkzeug: ${args.fog_mode || 'Aufdecken'}. Karte anklicken oder ziehen, um Bereiche zu bearbeiten.`
                : `Bild anklicken, um einen Pin \u201e${selectedLabel}\u201c zu setzen.`;
            app.append(hint);

            const shell = document.createElement('div');
            shell.className = 'board-shell';
            const imageWrap = document.createElement('div');
            imageWrap.className = 'image-wrap';
            const image = document.createElement('img');
            image.alt = 'Bild mit Monster- und Ortsmarkierungen';
            image.src = `data:${args.image_type || 'image/png'};base64,${args.image_data}`;
            const terrainLayer = document.createElementNS(
                'http://www.w3.org/2000/svg',
                'svg'
            );
            terrainLayer.classList.add('terrain-layer');
            terrainLayer.setAttribute('viewBox', '0 0 1000 1000');
            terrainLayer.setAttribute('preserveAspectRatio', 'none');
            terrainLayer.setAttribute('aria-hidden', 'true');
            imageWrap.classList.toggle('terrain-active', terrainEnabled);
            renderTerrain(terrainLayer);
            const layer = document.createElement('div');
            layer.className = 'pin-layer';
            const fogCanvas = document.createElement('canvas');
            fogCanvas.className = 'fog-canvas';
            fogCanvas.style.display = fogEnabled ? 'block' : 'none';
            fogCanvas.style.pointerEvents = fogEnabled ? 'auto' : 'none';
            fogCanvas.setAttribute('aria-label', 'Nebel des Krieges');
            let drawingFog = false;
            fogCanvas.addEventListener('pointerdown', event => {
                if (!fogEnabled || event.button !== 0) return;
                const point = normalizedPoint(event, image);
                if (!point) return;
                event.preventDefault();
                event.stopPropagation();
                drawingFog = true;
                activeFogStroke = {
                    mode: fogMode,
                    radius: brushRadius,
                    points: [point]
                };
                fogCanvas.setPointerCapture(event.pointerId);
                renderFog(fogCanvas, image, true);
            });
            fogCanvas.addEventListener('pointermove', event => {
                if (!drawingFog || !fogCanvas.hasPointerCapture(event.pointerId)) return;
                const point = normalizedPoint(event, image);
                if (!point) return;
                const prior = activeFogStroke.points[activeFogStroke.points.length - 1];
                const bounds = image.getBoundingClientRect();
                if (
                    Math.hypot(
                        (point.x - prior.x) * bounds.width,
                        (point.y - prior.y) * bounds.height
                    ) < 2
                ) return;
                activeFogStroke.points.push(point);
                renderFog(fogCanvas, image, true);
            });
            const finishFogStroke = event => {
                if (!drawingFog || !fogCanvas.hasPointerCapture(event.pointerId)) return;
                drawingFog = false;
                fogCanvas.releasePointerCapture(event.pointerId);
                currentFogStrokes = [...currentFogStrokes, activeFogStroke]
                    .slice(-MAX_FOG_STROKES);
                activeFogStroke = null;
                renderFog(fogCanvas, image);
                sendPins();
            };
            fogCanvas.addEventListener('pointerup', finishFogStroke);
            fogCanvas.addEventListener('pointercancel', finishFogStroke);

            imageWrap.addEventListener('click', event => {
                if (fogEnabled) return;
                if (event.target.closest('.pin')) return;
                const point = normalizedPoint(event, image);
                if (!point) return;
                if (terrainEnabled) {
                    if (currentTerrainDraft.length >= 100) return;
                    const roundedPoint = {
                        x: Math.round(point.x * 10000) / 10000,
                        y: Math.round(point.y * 10000) / 10000
                    };
                    if (currentTerrainDraft.some(existing => (
                        Math.hypot(existing.x - roundedPoint.x, existing.y - roundedPoint.y) < 0.008
                    ))) return;
                    currentTerrainDraft = [...currentTerrainDraft, roundedPoint];
                    currentTerrainRevision += 1;
                    renderTerrain(terrainLayer);
                    sendPins();
                    return;
                }
                currentPins = [...currentPins, {
                    id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
                    x: point.x,
                    y: point.y,
                    label: selectedLabel
                }];
                renderPins(layer, image, showPinDetails);
                sendPins();
            });

            image.addEventListener('load', () => {
                renderPins(layer, image, showPinDetails);
                renderFog(fogCanvas, image);
                updateHeight();
            });
            image.addEventListener('error', () => {
                hint.textContent = 'Das Bild konnte nicht geladen werden.';
                updateHeight();
            });
            imageWrap.append(image, terrainLayer, layer, fogCanvas);
            shell.append(imageWrap);
            app.append(shell);
            fogResizeObserver = new ResizeObserver(() => renderFog(fogCanvas, image));
            fogResizeObserver.observe(imageWrap);
            if (image.complete && image.naturalWidth) {
                renderPins(layer, image, showPinDetails);
                renderFog(fogCanvas, image);
            }
            updateHeight();
        }

        window.addEventListener('message', event => {
            if (event.data && event.data.type === 'streamlit:render') {
                render(event.data.args || {});
            }
        });
        window.parent.postMessage({
            isStreamlitMessage: true,
            type: 'streamlit:componentReady',
            apiVersion: 1
        }, '*');
        new ResizeObserver(updateHeight).observe(document.body);
    </script>
</body>
</html>
